name: Release archive checks (no publish)

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CUDA_VISIBLE_DEVICES: "-1"
  HIP_VISIBLE_DEVICES: "-1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ROCR_VISIBLE_DEVICES: "-1"

jobs:
  python-distributions:
    name: Reproducible wheel and sdist checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          cache-dependency-path: |
            .github/workflows/release-check.yml
            pyproject.toml
          python-version: "3.12"
      - name: Install pinned build tools
        run: >-
          python -m pip install
          build==1.6.0
          setuptools==78.1.1
          wheel==0.45.1
      - name: Verify the tracked public source boundary
        run: python tools/release/check_tracked_source.py --root .
      - name: Build, compare, and smoke-test distributions
        run: tools/release/check_python_distributions.sh "${RUNNER_TEMP}/pixel4dgs-release-check"
